name: Publish NPM package to GitHub Packages

on:
    workflow_run:
        workflows: ["Test"]
        branches: [main]
        types:
            - completed

permissions:
    id-token: write  # Required for OIDC
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: 'https://registry.npmjs.org'
            - run: npm ci
            - run: npm run build
            - run: npm publish
